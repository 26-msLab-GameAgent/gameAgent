[project]
name = "v2s-gameagent"
version = "0.1.0"
description = "Portable three-game distribution of the 0928 visual-to-solver pipeline"
requires-python = ">=3.10"
dependencies = ["pillow", "numpy", "opencv-python-headless>=4.8", "pyyaml", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gameagent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
