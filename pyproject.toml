[project]
name = "gameagent"
version = "0.1.0"
description = "Terminal-first scaffold for a VLM-driven game auto-play agent."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
vlm = [
  "fastapi",
  "uvicorn",
  "torch",
  "transformers",
  "qwen-vl-utils",
  "accelerate",
  "pillow",
]

[project.scripts]
gameagent = "gameagent.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
