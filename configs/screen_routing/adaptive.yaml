classifier_model: openai:openai/gpt-6-astra
min_confidence: 0.8
ui_recheck_model: null
wait_ms: 1000
gui_actor:
  enabled: true
  url: http://127.0.0.1:8010
  timeout_s: 20
  top_k: 5
enable_board_solver: true
states:
  S:
    roles:
    - start
    - stage
    model: null
  P:
    roles:
    - close
    - dismiss
    - cancel
    model: null
  C:
    roles:
    - next
    - continue
    - home
    model: null
  T:
    roles:
    - start
    - confirm
    - next
    - continue
    - skip
    - close
    - dismiss
    model: null
  B:
    allowed_actions:
    - tap
    - double_tap
    - swipe
    - long_press
    - wait
    - noop
  L:
    roles: []
  U:
    roles: []
  R:
    roles:
    - retry
    - close
    - home
adaptive:
  templates: assets/ui_templates.json
  orb_references: assets/router_references/candy_crush_soda
  orb_min_good_matches: 12
  orb_min_inliers: 8
  orb_min_margin: 1.25
  short_wait_ms: 200
  reobserve_steps: 2
  max_recovery_calls: 3
  max_no_progress_steps: 14
  max_retries_per_stage: 2
  max_same_ui_attempts: 2
  board_refresh_steps: 8
  local_board: true
