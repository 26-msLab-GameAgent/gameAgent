runtime:
  mode: local_bluestacks_ollama_llava
  tick_interval_ms: 0
  settle_after_action_ms: 1200
  max_episode_steps: 1000
  emergency_stop_path: ./STOP

capture:
  adapter: adb_screencap
  device_id: 127.0.0.1:15555
  adb_path: tools/platform-tools/adb
  timeout_ms: 60000
  capture_method: exec_out
  output_format: png
  resize:
    width: 1920
    height: 1080

control:
  adapter: adb_touch
  device_id: 127.0.0.1:15555
  adb_path: tools/platform-tools/adb
  timeout_ms: 60000
  coordinate_space: device
  min_action_interval_ms: 250
  allowed_actions:
    - tap
    - swipe
    - long_press
    - wait
    - back
    - noop

model:
  provider: remote_inference
  endpoint: http://127.0.0.1:18082/v1/decide
  model: ollama_llava_7b
  # Includes enough time for the first Ollama model load.
  timeout_ms: 900000
  max_retries: 0

storage:
  run_dir: ./agent_runs
  timestamped_run_dir: false
  numbered_run_dir: true
  save_frames: true
  save_model_raw_response: true

guards:
  clamp_coordinates: true
  stop_on_sensitive_screen: true
  max_repeated_action_count: 3
