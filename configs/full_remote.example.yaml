runtime:
  mode: full_remote
  tick_interval_ms: 800
  max_episode_steps: 1000
  emergency_stop_path: ./STOP

capture:
  adapter: http_frame_stream
  endpoint: http://127.0.0.1:8080/v1/frame
  timeout_ms: 10000

control:
  adapter: http_action_bridge
  endpoint: http://127.0.0.1:8080/v1/action
  timeout_ms: 10000
  allowed_actions:
    - tap
    - swipe
    - long_press
    - wait
    - back
    - noop

model:
  provider: remote_inference
  endpoint: http://127.0.0.1:8080/v1/decide
  model: remote_vlm
  timeout_ms: 30000
  max_retries: 2

storage:
  run_dir: ./agent_runs
  save_frames: true
  save_model_raw_response: true

guards:
  clamp_coordinates: true
  max_repeated_action_count: 8
