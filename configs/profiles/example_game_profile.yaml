name: Example Game
objective: >
  Describe the high-level goal of the game here.

priorities:
  - Prefer actions that advance the current level or stage.
  - Handle popups, rewards, and completion screens before returning to gameplay.
  - If the previous action did not change the screen, choose a different valid action.

screen_rules:
  - On a menu or stage screen, choose the next playable stage or start button.
  - On a loading or transition screen, wait briefly.
  - On a completion screen, tap the continue/next/confirm button.
  - On a gameplay screen, follow the game-specific action rules below.

action_rules:
  - Use tap for buttons, menu choices, and single target actions.
  - Use swipe only when the game mechanic requires dragging between two points.
  - Use wait when the screen is animating or no safe action is visible.
  - Use noop when no action should be taken.

avoid:
  - Do not make purchases.
  - Do not change account settings.
  - Do not tap ads or external links unless explicitly allowed.
