# OpenRouter Claude handles perception/planning/policy.
# Rule learning stays on the locally cached Qwen2.5-VL-7B model.
default_model: openrouter:~anthropic/claude-sonnet-latest

agents:
  perception: openrouter:~anthropic/claude-sonnet-latest
  rule_learner: qwen:7B
  planner: openrouter:~anthropic/claude-sonnet-latest
  policy: openrouter:~anthropic/claude-sonnet-latest
