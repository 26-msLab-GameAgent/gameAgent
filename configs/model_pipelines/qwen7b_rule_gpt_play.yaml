# OpenRouter GPT handles perception/planning/policy.
# Rule learning stays on the locally cached Qwen2.5-VL-7B model.
default_model: openrouter:~openai/gpt-latest

agents:
  perception: openrouter:~openai/gpt-latest
  rule_learner: qwen:7B
  planner: openrouter:~openai/gpt-latest
  policy: openrouter:~openai/gpt-latest
