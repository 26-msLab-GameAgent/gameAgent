runtime:
  mode: local_bluestacks
  tick_interval_ms: 0
  settle_after_action_ms: 800
  max_episode_steps: 1000
  emergency_stop_path: ./STOP

capture:
  adapter: adb_screencap
  device_id: 127.0.0.1:15555
  adb_path: tools/platform-tools/adb
  timeout_ms: 30000
  capture_method: auto
  output_format: png
  resize:
    width: 720
    height: 1280

control:
  adapter: adb_touch
  device_id: 127.0.0.1:15555
  adb_path: tools/platform-tools/adb
  timeout_ms: 30000
  coordinate_space: device
  min_action_interval_ms: 250
  allowed_actions:
    - tap
    - swipe
    - long_press
    - wait
    - back
    - noop

model:
  provider: mock

storage:
  run_dir: ./agent_runs
  save_frames: true
  save_model_raw_response: true

guards:
  clamp_coordinates: true
  stop_on_sensitive_screen: true
  max_repeated_action_count: 8
