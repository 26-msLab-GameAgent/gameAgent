rules:
  - id: sell_ready_order
    states: [B]
    when: 손님 주문 카드의 아이템 배경이 초록색이고 해당 손님에게 판매 체크 버튼이 현재 보인다.
    target: 화면 상단 손님 주문 영역에 있는 판매용 초록색 체크 버튼. 보드 위 아이템이나 상점 버튼이 아니다.
    success: 해당 손님의 판매 체크 버튼이 사라지고 주문이 변경되거나, 주문 아이템 소모 또는 코인 증가가 확인된다.
  - id: dismiss_tutorial
    states: [T, P]
    when: 플레이 방법 튜토리얼 팝업이 보드를 가리고 있으며 탭하여 닫기 안내가 보인다.
    target: 플레이 방법 튜토리얼 팝업의 탭하여 닫기 영역.
    success: 튜토리얼 팝업이 사라지고 플레이 보드가 보인다.
